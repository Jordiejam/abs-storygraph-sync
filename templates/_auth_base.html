<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABS → StoryGraph — {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ asset_url('theme.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.6rem 0.85rem;
      font-size: 0.9rem;
      margin-bottom: 1.1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--accent); }

    .error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.25);
      border-radius: 8px;
      color: var(--red);
      font-size: 0.82rem;
      margin-bottom: 1.1rem;
      padding: 0.55rem 0.8rem;
    }

    button {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.65rem;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }
{% block style %}{% endblock %}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">📚</div>
      ABS → StoryGraph
    </div>
    <p class="subtitle">{% block subtitle %}{% endblock %}</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    {% block before_form %}{% endblock %}

    <form method="post" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" type="text"
             autocomplete="username" autofocus required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="{% block password_autocomplete %}current-password{% endblock %}" required>

      <button type="submit">{% block submit_label %}{% endblock %}</button>
    </form>
  </div>
</body>
</html>
